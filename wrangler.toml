name = "ryzel"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Environment variables and secrets are NOT set here for anything sensitive.
# Set public build-time vars below if needed, and set secrets (Supabase
# service role key, Korapay secret key, etc.) via:
#   npx wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
# or in the Cloudflare dashboard under Pages > your project > Settings > Environment variables.
#
# [vars]
# NEXT_PUBLIC_APP_URL = "https://your-domain.com"
